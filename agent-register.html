<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नया कार्यकर्ता रजिस्ट्रेशन | ओजस्वी फाउंडेशन</title>
    
    <!-- 🚨 FIREBASE ENGINES 🚨 -->
    <script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-firestore-compat.js"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --saffron: #FF9933; --green: #138808; --navy: #1c2c52; --light-bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--light-bg); color: #333; }
        
        .navbar { background: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .logo-section { display: flex; align-items: center; gap: 15px; }
        .logo-section img { height: 55px; }
        .brand-text h1 { margin: 0; font-size: 22px; color: var(--navy); }
        .brand-text span { font-size: 12px; color: var(--saffron); font-weight: bold; }
        .nav-links a { text-decoration: none; color: var(--navy); font-weight: 600; margin-left: 20px; font-size: 15px; }
        .btn-login { background: var(--navy); color: white !important; padding: 8px 20px; border-radius: 25px; }
        
        .auth-container { max-width: 450px; margin: 50px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid var(--saffron); }
        .auth-container h2 { color: var(--navy); text-align: center; margin-top: 0; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 13px; color: #444; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        .form-group input:focus { border-color: var(--saffron); outline: none; }
        
        .btn-main { width: 100%; background: var(--green); color: white; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-main:hover { background: #0f6c06; }
        
        .switch-link { margin-top: 20px; font-size: 14px; text-align: center; color: #555; }
        .switch-link a { color: var(--saffron); text-decoration: none; font-weight: bold; }
        
        #successSection { display: none; text-align: center; }
        .id-box { background: #f0fdf4; padding: 20px; border-radius: 8px; border: 2px dashed var(--green); margin: 20px 0; }
        .id-box h1 { margin: 10px 0; color: var(--navy); letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo-section">
            <img src="assets/ojasvi-logo.png" alt="Logo">
            <div class="brand-text">
                <h1>ओजस्वी जनकल्याण</h1>
                <span>OJASVI FOUNDATION</span>
            </div>
        </div>
        <div class="nav-links">
            <a href="login.html" class="btn-login">लॉगिन करें <i class="fas fa-sign-in-alt"></i></a>
        </div>
    </div>

    <div class="auth-container">
        
        <!-- REGISTER FORM -->
        <div id="registerSection">
            <h2><i class="fas fa-user-plus"></i> नया कार्यकर्ता जुड़ें</h2>
            <p class="subtitle">सिर्फ 1 मिनट में अपना अकाउंट बनाएँ।</p>
            
            <form id="agentForm">
                <div class="form-group"><label>पूरा नाम *</label><input type="text" id="r_name" required></div>
                <div class="form-group"><label>मोबाइल नंबर *</label><input type="tel" id="r_mobile" pattern="[0-9]{10}" required></div>
                <div class="form-group"><label>ईमेल आईडी *</label><input type="email" id="r_email" required></div>
                <div class="form-group"><label>नया पासवर्ड बनाएँ *</label><input type="password" id="r_password" minlength="6" required></div>
                
                <button type="button" id="btnRegister" class="btn-main" onclick="handleRegistration()"><i class="fas fa-check-circle"></i> रजिस्टर करें</button>
                <div id="regMsg" style="text-align: center; margin-top: 10px; color: red; font-size: 13px; font-weight: bold;"></div>
            </form>
            <div class="switch-link">पहले से अकाउंट है? <a href="login.html">यहाँ लॉगिन करें</a></div>
        </div>

        <!-- SUCCESS SCREEN -->
        <div id="successSection">
            <i class="fas fa-check-circle" style="font-size: 60px; color: var(--green);"></i>
            <h2 style="margin-top: 15px; color: var(--green);">रजिस्ट्रेशन सफल!</h2>
            <p style="color: #666;">आपका अकाउंट बन गया है।</p>
            
            <div class="id-box">
                <p style="margin:0; font-size: 14px; color: #666;">आपकी नई ID (Agent Code)</p>
                <h1 id="newAgentId"></h1>
            </div>
            
            <p style="font-size: 13px; color: #555;">पोर्टल के अंदर जाकर अपनी <strong>KYC (आधार, पैन)</strong> पूरी करें।</p>
            <button onclick="window.location.href='login.html'" class="btn-main" style="background: var(--navy);"><i class="fas fa-sign-in-alt"></i> अब लॉगिन करें</button>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJSVwr6VhJexbfQ4qQket0NsfJ5yHzm04",
            authDomain: "ojaswi-jan-kalyan-foundation.firebaseapp.com",
            projectId: "ojaswi-jan-kalyan-foundation",
            storageBucket: "ojaswi-jan-kalyan-foundation.firebasestorage.app",
            messagingSenderId: "249455861155",
            appId: "1:249455861155:web:c7a1f0493910e25f748e16"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        async function handleRegistration() {
            const form = document.getElementById('agentForm');
            if (!form.checkValidity()) { form.reportValidity(); return; }

            const btn = document.getElementById('btnRegister');
            const msg = document.getElementById('regMsg');
            
            const name = document.getElementById('r_name').value;
            const mobile = document.getElementById('r_mobile').value;
            const email = document.getElementById('r_email').value.trim().toLowerCase();
            const password = document.getElementById('r_password').value;

            try {
                btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> अकाउंट बन रहा है...";
                btn.disabled = true;
                msg.innerText = "";

                // 1. Firebase Auth में अकाउंट बनाना
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const uid = userCredential.user.uid;

                // 2. नया Agent Code बनाना (जैसे: OJKF-AG-4589)
                const randomNum = Math.floor(1000 + Math.random() * 9000);
                const agentCode = "OJKF-AG-" + randomNum;

                // 3. डेटाबेस (Firestore) में डिटेल्स सेव करना
                await db.collection('agents').doc(uid).set({
                    id: uid,
                    name: name,
                    mobile: mobile,
                    email: email,
                    agent_code: agentCode,
                    status: 'Pending KYC',
                    created_at: firebase.firestore.FieldValue.serverTimestamp()
                });

                // 4. सक्सेस स्क्रीन दिखाना
                document.getElementById('registerSection').style.display = 'none';
                document.getElementById('successSection').style.display = 'block';
                document.getElementById('newAgentId').innerText = agentCode;

                // (सिक्योरिटी के लिए यूजर को तुरंत लॉगआउट कर दें, ताकि वो लॉगिन पेज से आए)
                await auth.signOut();

            } catch (error) {
                if(error.message.includes("email-already-in-use")) msg.innerText = "❌ यह ईमेल पहले से रजिस्टर है!";
                else msg.innerText = "❌ एरर: " + error.message;
                
                btn.innerHTML = "<i class='fas fa-check-circle'></i> रजिस्टर करें";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
