<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एजेंट डैशबोर्ड | ओजस्वी फाउंडेशन</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root { --saffron: #FF9933; --green: #138808; --navy: #1c2c52; --light-bg: #f4f7f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; background-color: var(--light-bg); color: #333; }

        .sidebar { width: 260px; background-color: var(--navy); color: white; height: 100vh; position: fixed; padding-top: 20px; box-shadow: 4px 0 10px rgba(0,0,0,0.1); }
        .logo-area { text-align: center; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; }
        .logo-area img { height: 50px; background: white; padding: 5px; border-radius: 5px; margin-bottom: 10px; }
        .logo-area h3 { color: var(--saffron); font-size: 18px; margin: 0; }
        
        .nav-menu { list-style: none; }
        .nav-menu li { padding: 15px 25px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; font-size: 15px; border-left: 4px solid transparent; }
        .nav-menu li:hover, .nav-menu li.active { background-color: rgba(255,255,255,0.05); border-left-color: var(--saffron); color: var(--saffron); }
        
        .main-content { margin-left: 260px; width: calc(100% - 260px); padding: 25px; }
        .top-header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .user-profile { display: flex; align-items: center; gap: 15px; }
        .user-profile img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--green); }
        
        .dashboard-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between; border-bottom: 4px solid var(--navy); }
        .card:nth-child(2) { border-bottom-color: var(--saffron); }
        .card:nth-child(3) { border-bottom-color: var(--green); }
        .card h4 { color: #666; font-size: 14px; margin-bottom: 8px; }
        .card h2 { color: var(--navy); font-size: 28px; }
        .card i { font-size: 35px; color: rgba(28, 44, 82, 0.1); }

        .content-section { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: none; }
        .content-section.active { display: block; }
        .content-section h3 { color: var(--navy); margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 13px; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-group input[type="file"] { padding: 9px; background: #f8f9fa; }
        
        .btn-submit { background: var(--green); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; width: 100%; margin-top: 15px; }
        .btn-submit:hover { background: #0f6c06; }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); z-index: 1000; }
            .main-content { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-area">
            <img src="assets/ojasvi-logo.png" alt="Logo">
            <h3>एजेंट पोर्टल</h3>
        </div>
        <ul class="nav-menu">
            <li class="active" onclick="showSection('dashboard', this)"><i class="fas fa-home"></i> डैशबोर्ड</li>
            <li onclick="showSection('add-member', this)"><i class="fas fa-user-plus"></i> नया मेंबर जोड़ें (KYC)</li>
            <li onclick="window.location.href='login.html'"><i class="fas fa-sign-out-alt"></i> लॉगआउट</li>
        </ul>
    </div>

    <div class="main-content">
        <div class="top-header">
            <h3 style="color: var(--navy);"><i class="fas fa-bars"></i> ओजस्वी जनकल्याण फाउंडेशन</h3>
            <div class="user-profile">
                <div style="text-align: right;">
                    <strong style="color: var(--navy);">एजेंट टेस्ट</strong><br>
                    <span style="font-size: 12px; color: #666;">ID: OJKF-AG-0001</span>
                </div>
                <img src="https://via.placeholder.com/45" alt="Agent">
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="content-section active">
            <div class="dashboard-cards">
                <div class="card"><div><h4>मेरे कुल मेंबर्स</h4><h2 id="total_members">0</h2></div><i class="fas fa-users"></i></div>
                <div class="card"><div><h4>पेंडिंग अप्रूवल</h4><h2 id="pending_members">0</h2></div><i class="fas fa-clock"></i></div>
            </div>
            <h3><i class="fas fa-list"></i> हाल ही में जोड़े गए मेंबर्स</h3>
            <p style="color: #666; font-size: 14px;">(डेटा लाने का कोड हम अगले स्टेप में जोड़ेंगे)</p>
        </div>

        <!-- Add Member Form -->
        <div id="add-member" class="content-section">
            <h3><i class="fas fa-user-plus"></i> नया मेंबर रजिस्ट्रेशन & KYC</h3>
            
            <form id="memberForm" onsubmit="submitMember(event)">
                <div class="form-grid">
                    <div class="form-group"><label>पूरा नाम *</label><input type="text" id="m_name" required></div>
                    <div class="form-group"><label>जन्म तिथि (DOB) *</label><input type="date" id="m_dob" required></div>
                    <div class="form-group">
                        <label>लिंग (Gender) *</label>
                        <select id="m_gender" required>
                            <option value="">-- चुनें --</option><option value="Male">पुरुष</option><option value="Female">महिला</option>
                        </select>
                    </div>
                    <div class="form-group"><label>मोबाइल नंबर *</label><input type="tel" id="m_mobile" pattern="[0-9]{10}" required></div>
                    <div class="form-group"><label>आधार कार्ड नंबर *</label><input type="text" id="m_aadhaar" required></div>
                    <div class="form-group"><label>पैन कार्ड नंबर</label><input type="text" id="m_pan"></div>
                    <div class="form-group"><label>नॉमिनी का नाम *</label><input type="text" id="m_nominee" required></div>
                </div>

                <h4 style="margin: 20px 0 15px 0; color: var(--navy); border-bottom: 1px dashed #ccc; padding-bottom: 5px;">KYC डाक्यूमेंट्स अपलोड</h4>
                <div class="form-grid">
                    <div class="form-group"><label>पासपोर्ट साइज फोटो *</label><input type="file" id="m_photo" accept="image/*" required></div>
                    <div class="form-group"><label>आधार कार्ड *</label><input type="file" id="m_aadhaar_file" accept="image/*,application/pdf" required></div>
                    <div class="form-group"><label>पैन कार्ड</label><input type="file" id="m_pan_file" accept="image/*,application/pdf"></div>
                </div>

                <button type="submit" class="btn-submit" id="btnSaveMember"><i class="fas fa-save"></i> मेंबर रजिस्टर करें</button>
                <div id="formMsg" style="margin-top: 10px; font-weight: bold; text-align: center;"></div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://neybyzqjnqmbbjxruzdv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5leWJ5enFqbnFtYmJqeHJ1emR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTY0NDcsImV4cCI6MjEwMDk3MjQ0N30.upk2GSCavQEMGp1pzgbsbV-6Pe0I54n2gYlJRmqYXOY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function showSection(sectionId, element) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-menu li').forEach(li => li.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            element.classList.add('active');
        }

        async function uploadFile(file, folderName) {
            if (!file) return null;
            const fileExt = file.name.split('.').pop();
            const fileName = `${folderName}/${Date.now()}.${fileExt}`; // Ex: photos/16912345.jpg
            
            const { data, error } = await supabase.storage.from('kyc_documents').upload(fileName, file);
            if (error) throw error;
            
            // Get public URL
            const { data: urlData } = supabase.storage.from('kyc_documents').getPublicUrl(fileName);
            return urlData.publicUrl;
        }

        async function submitMember(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSaveMember');
            const msg = document.getElementById('formMsg');
            
            try {
                btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> अपलोड हो रहा है (इसमें समय लग सकता है)...";
                btn.disabled = true;
                msg.innerText = "";

                // 1. Files Upload
                const photoUrl = await uploadFile(document.getElementById('m_photo').files[0], 'photos');
                const aadhaarUrl = await uploadFile(document.getElementById('m_aadhaar_file').files[0], 'aadhaar');
                const panUrl = await uploadFile(document.getElementById('m_pan_file').files[0], 'pan');

                // 2. Insert Database Record
                const memberData = {
                    name: document.getElementById('m_name').value,
                    dob: document.getElementById('m_dob').value,
                    gender: document.getElementById('m_gender').value,
                    mobile: document.getElementById('m_mobile').value,
                    aadhaar: document.getElementById('m_aadhaar').value,
                    pan: document.getElementById('m_pan').value,
                    nominee: document.getElementById('m_nominee').value,
                    agent_id: 'OJKF-AG-0001', // Temporary Hardcoded
                    status: 'Pending',
                    photo_url: photoUrl,
                    aadhaar_url: aadhaarUrl,
                    pan_url: panUrl
                };

                const { error } = await supabase.from('members').insert([memberData]);
                if (error) throw error;

                // Success
                msg.style.color = "green";
                msg.innerText = "✅ मेंबर और KYC सफलतापूर्वक सेव हो गए हैं!";
                document.getElementById('memberForm').reset();

            } catch (error) {
                msg.style.color = "red";
                msg.innerText = "❌ एरर: " + error.message;
            } finally {
                btn.innerHTML = "<i class='fas fa-save'></i> मेंबर रजिस्टर करें";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
