<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पोर्टल लॉगिन | ओजस्वी जनकल्याण फाउंडेशन</title>

    <!-- 🚨 FIREBASE ENGINES 🚨 -->
    <script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-firestore-compat.js"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root { --saffron: #FF9933; --green: #138808; --navy: #1c2c52; --light-bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--light-bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; width: 100%; overflow-x: hidden; }

        .auth-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; border-top: 5px solid var(--saffron); position: relative; margin: 20px auto; }
        .auth-container img { height: 60px; margin-bottom: 15px; }

        h2 { margin: 0 0 5px 0; color: var(--navy); font-size: 24px; }
        p.subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }

        .form-group { margin-bottom: 15px; text-align: left; position: relative; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; color: #444; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; transition: 0.3s; }
        .form-group input:focus { border-color: var(--saffron); outline: none; box-shadow: 0 0 5px rgba(255,153,51,0.2); }
        
        .password-toggle { position: absolute; right: 15px; top: 35px; cursor: pointer; color: #888; font-size: 16px; transition: 0.3s; }

        .btn-main { width: 100%; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-login-color { background: var(--navy); }
        .btn-login-color:hover { background: #121c36; }
        .btn-forgot-color { background: var(--saffron); }

        .forgot-link { text-align: right; margin-bottom: 15px; }
        .forgot-link a { font-size: 13px; color: var(--saffron); text-decoration: none; }

        .switch-link { margin-top: 20px; font-size: 14px; color: #555; }
        .switch-link a { color: var(--saffron); text-decoration: none; font-weight: bold; cursor: pointer; }

        .back-home { position: absolute; top: 15px; left: 15px; color: #888; text-decoration: none; font-size: 14px; transition: 0.3s; }

        .auth-section { display: none; }
        .auth-section.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="auth-container">
        <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> होम</a>
        <img src="assets/ojasvi-logo.png" alt="Logo">

        <!-- LOGIN SECTION -->
        <div id="loginSection" class="auth-section active">
            <h2>पोर्टल लॉगिन</h2>
            <p class="subtitle">एडमिन और कार्यकर्ता यहाँ से लॉगिन करें</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>ईमेल आईडी (Email)</label>
                    <input type="email" id="email" required placeholder="रजिस्टर्ड ईमेल डालें">
                </div>
                <div class="form-group">
                    <label>पासवर्ड</label>
                    <input type="password" id="password" required placeholder="अपना पासवर्ड डालें" style="padding-right:40px;">
                    <i class="fas fa-eye password-toggle" id="togglePasswordBtn" onclick="togglePassword()"></i>
                </div>
                <div class="forgot-link"><a href="#" onclick="switchTab('forgotSection')">पासवर्ड भूल गए?</a></div>

                <button type="button" id="loginBtn" class="btn-main btn-login-color" onclick="doLogin()">
                    <i class="fas fa-sign-in-alt"></i> सुरक्षित लॉगिन करें
                </button>
            </form>

            <div class="switch-link">
                संस्था से नए जुड़ रहे हैं? <a href="agent-register.html">यहाँ रजिस्टर करें</a>
            </div>
        </div>

        <!-- FORGOT PASSWORD SECTION -->
        <div id="forgotSection" class="auth-section">
            <h2>पासवर्ड रीसेट</h2>
            <p class="subtitle">अपनी ईमेल डालें, हम पासवर्ड बदलने का लिंक भेजेंगे</p>

            <form id="forgotForm">
                <div class="form-group">
                    <label>रजिस्टर्ड ईमेल आईडी</label>
                    <input type="email" id="resetEmail" required placeholder="अपनी ईमेल आईडी डालें">
                </div>
                <button type="button" id="resetBtn" class="btn-main btn-forgot-color" onclick="doReset()">
                    <i class="fas fa-envelope"></i> रीसेट लिंक भेजें
                </button>
            </form>

            <div class="switch-link">
                याद आ गया? <a href="#" onclick="switchTab('loginSection')">वापस लॉगिन पर जाएँ</a>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJSVwr6VhJexbfQ4qQket0NsfJ5yHzm04",
            authDomain: "ojaswi-jan-kalyan-foundation.firebaseapp.com",
            projectId: "ojaswi-jan-kalyan-foundation",
            storageBucket: "ojaswi-jan-kalyan-foundation.firebasestorage.app",
            messagingSenderId: "249455861155",
            appId: "1:249455861155:web:c7a1f0493910e25f748e16"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        function switchTab(tabId) {
            document.querySelectorAll('.auth-section').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        function togglePassword() {
            const pwd = document.getElementById("password");
            const icon = document.getElementById("togglePasswordBtn");
            if (pwd.type === "password") { pwd.type = "text"; icon.className = "fas fa-eye-slash password-toggle"; } 
            else { pwd.type = "password"; icon.className = "fas fa-eye password-toggle"; }
        }

        async function doLogin() {
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            if(!email || !password) { alert("ईमेल और पासवर्ड भरें!"); return; }

            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> चेक कर रहे हैं...";
            btn.disabled = true;

            try {
                // 1. Firebase Login
                await auth.signInWithEmailAndPassword(email, password);
                btn.innerHTML = "<i class='fas fa-check-circle'></i> सफल! खुल रहा है...";

                // 2. स्मार्ट चेकर (Smart Redirect)
                const adminDoc = await db.collection('admin_users').doc(email).get();
                
                setTimeout(() => {
                    if (adminDoc.exists) {
                        window.location.href = 'admin.html'; // एडमिन को एडमिन पेज पर
                    } else {
                        window.location.href = 'agent.html'; // एजेंट को एजेंट पेज पर
                    }
                }, 800);

            } catch (error) {
                alert("❌ लॉगिन फेल: पासवर्ड या ईमेल गलत है!");
                btn.innerHTML = "<i class='fas fa-sign-in-alt'></i> सुरक्षित लॉगिन करें";
                btn.disabled = false;
            }
        }

        async function doReset() {
            const email = document.getElementById('resetEmail').value;
            const btn = document.getElementById('resetBtn');
            if(!email) return;

            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> भेज रहे हैं...";
            btn.disabled = true;

            try {
                await auth.sendPasswordResetEmail(email);
                alert("✅ पासवर्ड रीसेट लिंक आपकी ईमेल पर भेज दिया गया है!");
                switchTab('loginSection');
            } catch (error) {
                alert("❌ एरर: " + error.message);
            } finally {
                btn.innerHTML = "<i class='fas fa-envelope'></i> रीसेट लिंक भेजें";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
