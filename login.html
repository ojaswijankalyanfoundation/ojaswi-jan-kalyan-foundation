<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एजेंट पोर्टल - लॉगिन | ओजस्वी फाउंडेशन</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --saffron: #FF9933; --green: #138808; --navy: #1c2c52; --light-bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--light-bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; border-top: 5px solid var(--navy); margin: 20px 0; }
        .login-box img { height: 60px; margin-bottom: 10px; }
        .login-box h2 { color: var(--navy); margin: 0 0 5px 0; }
        .login-box p { color: #666; font-size: 14px; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        
        .btn-login { width: 100%; background: var(--saffron); color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-login:hover { background: #e68a2e; }
        
        .extra-links { display: flex; justify-content: space-between; margin-top: 15px; font-size: 13px; }
        .extra-links a { color: var(--navy); text-decoration: none; font-weight: 600; }
        .extra-links a:hover { text-decoration: underline; }
        
        .register-box { margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee; font-size: 14px; }
        .btn-register { display: inline-block; margin-top: 10px; color: var(--green); text-decoration: none; font-weight: bold; border: 1px solid var(--green); padding: 8px 20px; border-radius: 20px; transition: 0.3s; }
        .btn-register:hover { background: var(--green); color: white; }
        
        .back-home { position: absolute; top: 20px; left: 20px; color: var(--navy); text-decoration: none; font-weight: bold; font-size: 14px; }
        
        @media (max-width: 480px) {
            .back-home { position: static; display: block; text-align: left; padding: 15px; width: 100%; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
            body { flex-direction: column; justify-content: flex-start; }
            .login-box { padding: 25px; margin-top: 0; border-radius: 0; box-shadow: none; border-top: none; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> होमपेज पर लौटें</a>
    
    <div class="login-box">
        <img src="assets/ojasvi-logo.png" alt="Logo">
        <h2>एजेंट पोर्टल</h2>
        <p>अपने अकाउंट में लॉगिन करें</p>
        
        <form onsubmit="event.preventDefault(); window.location.href='agent.html';">
            <div class="form-group">
                <label>लॉगिन आईडी (Agent ID)</label>
                <input type="text" placeholder="OJKF-AG-0001" required>
            </div>
            <div class="form-group">
                <label>पासवर्ड</label>
                <input type="password" placeholder="अपना पासवर्ड डालें" required>
            </div>
            
            <div class="extra-links">
                <label><input type="checkbox"> याद रखें</label>
                <a href="#" onclick="alert('यह सर्विस जल्द शुरू होगी।')">पासवर्ड भूल गए?</a>
            </div>
            
            <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> लॉगिन करें</button>
        </form>
        
        <div class="register-box">
            <span style="color: #555;">संस्था के साथ नए एजेंट के रूप में जुड़ना चाहते हैं?</span><br>
            <a href="agent-register.html" class="btn-register"><i class="fas fa-user-plus"></i> नया रजिस्ट्रेशन करें</a>
        </div>
    </div>
</body>
</html>
