<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एजेंट पोर्टल | ओजस्वी जनकल्याण फाउंडेशन</title>
    <!-- Supabase & Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- आपकी अलग की गई CSS फाइल को यहाँ लिंक किया है -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> होम</a>
        <img src="assets/ojasvi-logo.png" alt="Logo">

        <!-- ================= LOGIN SECTION ================= -->
        <div id="loginSection" class="auth-section active">
            <h2>एजेंट लॉगिन</h2>
            <p class="subtitle">पोर्टल में जाने के लिए अपनी डिटेल्स भरें</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>ईमेल आईडी (Email)</label>
                    <input type="email" id="email" placeholder="अपनी रजिस्टर्ड ईमेल डालें" required>
                </div>
                <div class="form-group">
                    <label>पासवर्ड</label>
                    <input type="password" id="password" placeholder="अपना पासवर्ड डालें" required>
                </div>
                <div class="forgot-link">
                    <a href="#" id="showForgot">पासवर्ड भूल गए?</a>
                </div>
                <button type="submit" id="loginBtn" class="btn-main btn-login-color"><i class="fas fa-sign-in-alt"></i> सुरक्षित लॉगिन करें</button>
            </form>
            
            <div class="switch-link">
                संस्था से नए जुड़ रहे हैं? <a href="agent-register.html">यहाँ रजिस्टर करें</a>
            </div>
        </div>

        <!-- ================= FORGOT PASSWORD SECTION ================= -->
        <div id="forgotSection" class="auth-section">
            <h2>पासवर्ड रीसेट</h2>
            <p class="subtitle">अपनी ईमेल डालें, हम पासवर्ड बदलने का लिंक भेजेंगे</p>
            
            <form id="forgotForm">
                <div class="form-group">
                    <label>रजिस्टर्ड ईमेल आईडी</label>
                    <input type="email" id="resetEmail" placeholder="अपनी ईमेल आईडी डालें" required>
                </div>
                <button type="submit" id="resetBtn" class="btn-main btn-forgot-color"><i class="fas fa-envelope"></i> रीसेट लिंक भेजें</button>
            </form>
            
            <div class="switch-link">
                याद आ गया? <a href="#" id="showLogin">वापस लॉगिन पर जाएँ</a>
            </div>
        </div>
    </div>

    <!-- आपकी अलग की गई JavaScript फाइल को यहाँ लिंक किया है -->
    <script src="script.js"></script>
</body>
</html>
