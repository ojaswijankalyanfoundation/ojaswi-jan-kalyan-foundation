<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>एडमिन पैनल | ओजस्वी फाउंडेशन</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root { --admin-dark: #1e1e2f; --admin-card: #27293d; --accent: #e14eca; --success: #00f2c3; --danger: #fd5d93; }
        body { font-family: sans-serif; margin: 0; background: var(--admin-dark); color: white; }
        
        #login-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-box { background: var(--admin-card); padding: 30px 20px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; border-top: 4px solid var(--accent); }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #444; border-radius: 6px; background: #1e1e2f; color: white; box-sizing: border-box; }
        .btn-login { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        #loginError { font-size: 13px; margin-top: 15px; display: none; background: var(--danger); padding: 10px; border-radius: 6px; }
        #admin-dashboard { display: none; padding: 20px; text-align: center; }
    </style>
</head>
<body>

    <!-- 🔒 LOGIN SCREEN (बिना फॉर्म टैग के) -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-top:0;">एडमिन लॉगिन</h2>
            <p style="color:#888; font-size:12px;">केवल अधिकृत एडमिन के लिए</p>
            
            <div id="loginFormContainer">
                <div class="form-group">
                    <label>एडमिन ईमेल</label>
                    <input type="email" id="adminEmail" placeholder="email@example.com">
                </div>
                <div class="form-group">
                    <label>पासवर्ड</label>
                    <input type="password" id="adminPassword" placeholder="••••••••">
                </div>
                
                <button type="button" id="loginBtn" class="btn-login" onclick="doAdminLogin()">लॉगिन करें</button>
                <div id="loginError"></div>
            </div>
        </div>
    </div>

    <!-- 📊 DASHBOARD -->
    <div id="admin-dashboard">
        <h2 style="color: var(--success);">लॉगिन सफल!</h2>
        <p>एडमिन डैशबोर्ड में आपका स्वागत है।</p>
        <button onclick="location.reload()" style="padding:10px; background:red; color:white; border:none; border-radius:5px;">लॉगआउट करें</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://neybyzqjnqmbbjxruzdv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5leWJ5enFqbnFtYmJqeHJ1emR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTY0NDcsImV4cCI6MjEwMDk3MjQ0N30.upk2GSCavQEMGp1pzgbsbV-6Pe0I54n2gYlJRmqYXOY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function doAdminLogin() {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('loginBtn');
            const errorBox = document.getElementById('loginError');

            if(!email || !password) {
                errorBox.innerHTML = "ईमेल और पासवर्ड भरें!";
                errorBox.style.display = 'block';
                return;
            }

            errorBox.style.display = 'none';
            btn.innerHTML = "चेक कर रहे हैं...";
            btn.disabled = true;

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw new Error("ईमेल या पासवर्ड गलत है!");

                const { data: adminData, error: adminErr } = await supabase
                    .from('admin_users')
                    .select('*')
                    .eq('email', email)
                    .maybeSingle();

                if (!adminData) {
                    await supabase.auth.signOut();
                    throw new Error("आपको एडमिन पावर नहीं दी गई है!");
                }

                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';

            } catch (error) {
                errorBox.innerHTML = error.message; 
                errorBox.style.display = 'block';
                btn.innerHTML = "लॉगिन करें";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
