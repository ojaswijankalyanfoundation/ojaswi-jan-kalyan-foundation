<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन पैनल | ओजस्वी फाउंडेशन</title>
    
    <!-- Supabase & Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root { --admin-dark: #1e1e2f; --admin-card: #27293d; --admin-text: #e1e1e6; --accent: #e14eca; --success: #00f2c3; --danger: #fd5d93; --warning: #ff8d72; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--admin-dark); color: var(--admin-text); padding-bottom: 30px; }
        
        /* Header */
        .header { background: var(--admin-card); padding: 20px; text-align: center; border-bottom: 2px solid var(--accent); box-shadow: 0 4px 20px rgba(0,0,0,0.5); position: sticky; top: 0; z-index: 100; }
        .header h2 { margin: 0; color: white; font-size: 22px; letter-spacing: 1px; }
        .header span { font-size: 12px; color: var(--warning); }

        /* Dashboard Stats */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .stat-card { background: var(--admin-card); padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-left: 4px solid var(--accent); }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 30px; color: white; }
        .stat-card p { margin: 0; font-size: 13px; color: #9a9a9a; font-weight: bold; }

        /* Tabs Navigation */
        .tab-nav { display: flex; justify-content: space-around; background: var(--admin-card); margin: 0 20px; border-radius: 8px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 15px; text-align: center; color: #9a9a9a; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .tab-btn.active { background: var(--accent); color: white; }

        /* Tab Content Views */
        .tab-view { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .tab-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Data Tables */
        .table-container { background: var(--admin-card); border-radius: 12px; overflow-x: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(255,255,255,0.05); padding: 15px; font-size: 13px; color: white; border-bottom: 1px solid rgba(255,255,255,0.1); }
        td { padding: 15px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #c1c1c1; }
        
        /* Badges & Buttons */
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; color: white; }
        .badge.review { background: var(--warning); }
        .badge.active { background: var(--success); }
        .badge.rejected { background: var(--danger); }
        .badge.pending { background: #888; }

        .btn-action { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; color: white; margin-right: 5px; margin-bottom: 5px; }
        .btn-approve { background: var(--success); color: black; }
        .btn-reject { background: var(--danger); }
        .btn-view { background: #344675; }

        /* Document Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .modal-content { background: var(--admin-card); padding: 20px; border-radius: 12px; max-width: 600px; margin: 20px auto; position: relative; }
        .close-modal { position: absolute; top: 10px; right: 15px; color: white; font-size: 25px; cursor: pointer; }
        .doc-item { margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 15px; }
        .doc-item h4 { margin: 0 0 10px 0; color: var(--accent); }
        .doc-item img { max-width: 100%; border-radius: 8px; border: 1px solid #555; }
        .doc-item a { display: inline-block; background: var(--success); color: black; padding: 8px 15px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h2><i class="fas fa-shield-alt"></i> ओजस्वी एडमिन</h2>
        <span>मास्टर कंट्रोल रूम</span>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card" style="border-color: var(--success);">
            <h3 id="statAgents">0</h3>
            <p>कुल एजेंट (कार्यकर्ता)</p>
        </div>
        <div class="stat-card" style="border-color: var(--warning);">
            <h3 id="statKyc">0</h3>
            <p>KYC पेंडिंग</p>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tab-nav">
        <div class="tab-btn active" onclick="switchTab('kycList', this)"><i class="fas fa-id-card"></i> KYC अप्रूवल</div>
        <div class="tab-btn" onclick="switchTab('leadList', this)"><i class="fas fa-users"></i> नए लाभार्थी (Leads)</div>
    </div>

    <!-- TAB 1: KYC MANAGEMENT -->
    <div id="kycList" class="tab-view active">
        <h3 style="color: white; margin-top: 0;">KYC रिक्वेस्ट</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>नाम / ईमेल</th>
                        <th>स्टेटस</th>
                        <th>डॉक्यूमेंट्स</th>
                        <th>एक्शन</th>
                    </tr>
                </thead>
                <tbody id="kycTableBody">
                    <tr><td colspan="4" style="text-align:center;">डेटा लोड हो रहा है...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- TAB 2: LEADS MANAGEMENT -->
    <div id="leadList" class="tab-view">
        <h3 style="color: white; margin-top: 0;">लाभार्थी (Leads) लिस्ट</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>लाभार्थी का नाम</th>
                        <th>योजना</th>
                        <th>किसने जोड़ा?</th>
                        <th>स्टेटस</th>
                    </tr>
                </thead>
                <tbody id="leadsTableBody">
                    <tr><td colspan="4" style="text-align:center;">डेटा लोड हो रहा है...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL: VIEW DOCUMENTS -->
    <div id="docModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">×</span>
            <h3 style="color: white; margin-top: 0; border-bottom: 1px solid #555; padding-bottom: 10px;">एजेंट की जानकारी</h3>
            
            <div id="modalDataContent">
                <!-- डेटा यहाँ जावास्क्रिप्ट से आएगा -->
            </div>
            
        </div>
    </div>

    <script>
        // Supabase Setup
        const SUPABASE_URL = 'https://neybyzqjnqmbbjxruzdv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5leWJ5enFqbnFtYmJqeHJ1emR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTY0NDcsImV4cCI6MjEwMDk3MjQ0N30.upk2GSCavQEMGp1pzgbsbV-6Pe0I54n2gYlJRmqYXOY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allAgents = [];

        // Tab Switcher
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
        }

        function closeModal() {
            document.getElementById('docModal').style.display = 'none';
        }

        // 1. Fetch Data on Load
        async function fetchAdminData() {
            try {
                // Fetch Agents
                const { data: agents, error: err1 } = await supabase.from('agents').select('*').order('created_at', { ascending: false });
                if(err1) throw err1;
                allAgents = agents;

                // Fetch Leads
                const { data: leads, error: err2 } = await supabase.from('leads').select('*').order('created_at', { ascending: false });
                if(err2) throw err2;

                // Update Stats
                document.getElementById('statAgents').innerText = agents.length;
                document.getElementById('statKyc').innerText = agents.filter(a => a.status === 'Under Review').length;

                renderKYC(agents);
                renderLeads(leads);

            } catch (error) {
                alert("एरर: " + error.message);
            }
        }

        // 2. Render KYC Table
        function renderKYC(agents) {
            const tbody = document.getElementById('kycTableBody');
            tbody.innerHTML = '';

            if(agents.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">कोई एजेंट नहीं मिला</td></tr>';
                return;
            }

            agents.forEach(agent => {
                let badgeClass = 'pending';
                let statusText = 'Pending';
                if(agent.status === 'Under Review') { badgeClass = 'review'; statusText = 'चेकिंग में'; }
                if(agent.status === 'Active') { badgeClass = 'active'; statusText = 'अप्रूव्ड'; }
                if(agent.status === 'Rejected') { badgeClass = 'rejected'; statusText = 'रिजेक्टेड'; }

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${agent.name || 'N/A'}</strong><br><small style="color:#888;">${agent.email}</small></td>
                    <td><span class="badge ${badgeClass}">${statusText}</span></td>
                    <td>
                        <button class="btn-action btn-view" onclick="viewDocs('${agent.email}')"><i class="fas fa-eye"></i> देखें</button>
                    </td>
                    <td>
                        ${agent.status === 'Under Review' ? `
                            <button class="btn-action btn-approve" onclick="updateAgentStatus('${agent.email}', 'Active')"><i class="fas fa-check"></i></button>
                            <button class="btn-action btn-reject" onclick="updateAgentStatus('${agent.email}', 'Rejected')"><i class="fas fa-times"></i></button>
                        ` : '-'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 3. Render Leads Table
        function renderLeads(leads) {
            const tbody = document.getElementById('leadsTableBody');
            tbody.innerHTML = '';
            if(leads.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">कोई लाभार्थी नहीं मिला</td></tr>';
                return;
            }
            leads.forEach(lead => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${lead.name}</strong><br><small>${lead.mobile}</small></td>
                    <td>${lead.scheme_name}</td>
                    <td>${lead.agent_email}</td>
                    <td><span class="badge pending">Pending</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 4. View Agent Documents (Modal)
        function viewDocs(email) {
            const agent = allAgents.find(a => a.email === email);
            if(!agent) return;

            // HTML for showing data and documents safely
            let html = `
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom: 20px; background:#1e1e2f; padding:15px; border-radius:8px;">
                    <div><small style="color:#888;">बैंक का नाम</small><br>${agent.bank_name || '-'}</div>
                    <div><small style="color:#888;">अकाउंट नंबर</small><br>${agent.account_no || '-'}</div>
                    <div><small style="color:#888;">IFSC कोड</small><br>${agent.ifsc_code || '-'}</div>
                    <div><small style="color:#888;">पैन नंबर</small><br>${agent.pan_no || '-'}</div>
                    <div style="grid-column: span 2;"><small style="color:#888;">आधार नंबर</small><br>${agent.aadhaar_no || '-'}</div>
                </div>
                <h4 style="color:var(--accent);">अपलोड किए गए डाक्यूमेंट्स</h4>
            `;

            const docs = [
                { title: 'पासपोर्ट फोटो', url: agent.profile_photo },
                { title: 'पैन कार्ड', url: agent.pan_photo },
                { title: 'आधार फ्रंट', url: agent.aadhaar_file_front },
                { title: 'आधार बैक', url: agent.aadhaar_file_back },
                { title: 'बैंकिंग प्रूफ', url: agent.bank_proof_file }
            ];

            docs.forEach(doc => {
                if(doc.url) {
                    const isPdf = doc.url.toLowerCase().includes('.pdf');
                    html += `
                        <div class="doc-item">
                            <h4>${doc.title}</h4>
                            ${isPdf 
                                ? `<a href="${doc.url}" target="_blank"><i class="fas fa-file-pdf"></i> PDF डाउनलोड करें/देखें</a>` 
                                : `<a href="${doc.url}" target="_blank"><img src="${doc.url}" alt="${doc.title}"></a>`
                            }
                        </div>
                    `;
                }
            });

            document.getElementById('modalDataContent').innerHTML = html;
            document.getElementById('docModal').style.display = 'block';
        }

        // 5. Approve or Reject Action
        async function updateAgentStatus(email, newStatus) {
            let msg = newStatus === 'Active' ? 'क्या आप इस एजेंट को अप्रूव (Approve) करना चाहते हैं?' : 'क्या आप इस एजेंट को रिजेक्ट (Reject) करना चाहते हैं?';
            if(!confirm(msg)) return;

            try {
                const { error } = await supabase.from('agents').update({ status: newStatus }).eq('email', email);
                if (error) throw error;
                
                alert(`सफलता! एजेंट का स्टेटस "${newStatus}" कर दिया गया है।`);
                fetchAdminData(); // टेबल को रिफ्रेश करें

            } catch(e) {
                alert("एरर: " + e.message);
            }
        }

        // Start App
        window.onload = fetchAdminData;

    </script>
</body>
</html>
